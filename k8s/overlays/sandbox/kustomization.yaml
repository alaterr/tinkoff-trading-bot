apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: tinkoff-bot
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/YOUR_ORG/tinkoff-trading-bot:latest

