# Default values for tinkoff-trading-bot
# This is a YAML-formatted file.

# Image configuration
image:
  repository: ghcr.io/YOUR_ORG/tinkoff-trading-bot
  tag: latest
  pullPolicy: IfNotPresent

# Deployment configuration
replicaCount: 1

# Namespace (will be created if not exists)
namespace:
  create: true
  name: tinkoff-bot

# Service account
serviceAccount:
  create: false
  name: ""

# Security context
securityContext:
  fsGroup: 10001

# Pod security context
podSecurityContext: {}

# Container resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Environment variables
env:
  # Trading mode
  SANDBOX: "true"
  I_KNOW_WHAT_I_AM_DOING: "false"
  
  # UI configuration
  UI_ENABLED: "true"
  UI_HOST: "0.0.0.0"
  UI_PORT: "8000"
  
  # Application
  PYTHONPATH: "/app"
  AUTO_START: "false"  # Job mode: do not auto-start trading

# Secrets (set via --set-file or --set)
secrets:
  TOKEN: ""  # Set via: helm install ... --set secrets.TOKEN="your-token"
  ACCOUNT_ID: ""  # Optional

# Persistent volume for state.db and market_data_cache
persistence:
  enabled: true
  storageClass: ""  # Use default storage class if empty
  size: 2Gi
  accessMode: ReadWriteOnce

# UI Service
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8000  # Must match UI_PORT env var

# Instruments configuration (JSON)
instrumentsConfig:
  global_risk:
    max_positions_total: 10
    max_daily_loss_rub: 0
    max_weekly_loss_rub: 0
    max_trades_per_day: 10
    max_trades_per_week: 50
    risk_per_trade_pct: 0.01
    cooldown_seconds_after_error: 60
    kill_switch_file: "/data/kill.switch"  # Use PVC path, not /etc/kill-switch
  global_execution:
    order_type: "market"
    trade_on_close: true
    trade_only_market_hours: true
    timezone: "Europe/Moscow"
    price_slippage_bps: 0
    commission_bps: 0
  instruments:
    - figi: "REPLACE_WITH_FUTURES_FIGI"
      instrument_type: "futures"
      allow_short: true
      allow_margin: false
      max_position_qty: 10
      max_order_qty: 5
      rollover:
        enabled: true
        days_before_expiry_to_roll: 5
        roll_mode: "close_and_open"
        next_contract_figi: "REPLACE_WITH_NEXT_FUTURES_FIGI"
      strategy:
        name: "donchian_atr"
        parameters:
          breakout_lookback: 20
          exit_lookback: 10
          atr_period: 14
          atr_stop_mult: "3"
          base_target_qty: 1

# Kill-switch (optional ConfigMap, can also use file in PVC)
killSwitch:
  enabled: false  # Set to true to enable kill-switch via ConfigMap

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}
