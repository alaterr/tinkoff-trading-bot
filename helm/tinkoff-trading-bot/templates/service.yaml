{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tinkoff-trading-bot.fullname" . }}-ui
  namespace: {{ include "tinkoff-trading-bot.namespace" . }}
  labels:
    {{- include "tinkoff-trading-bot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tinkoff-trading-bot.selectorLabels" . | nindent 4 }}
{{- end }}
